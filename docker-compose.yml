services:
  occumendai-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: occumendai:latest
    ports:
      - "${HOST_PORT:-5000}:5000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s