services:
  occumendai-app:
    image: haliluzmez/occumendai:v1
    ports:
      - "5000:5000"
    env_file:
      - .env
    command: sh -c "gunicorn --workers=${GUNICORN_WORKERS:-1} --threads=${GUNICORN_THREADS:-4} --timeout=${GUNICORN_TIMEOUT:-120} --bind=0.0.0.0:${PORT:-5000} run:app"
    restart: unless-stopped